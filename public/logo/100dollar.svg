<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Badge Icon with gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3D2E" />
      <stop offset="100%" stop-color="#185642" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA424" />
      <stop offset="100%" stop-color="#E8890C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F3D2E" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect x="6" y="8" width="64" height="64" rx="16" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="10" y="12" width="56" height="56" rx="12" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />
  <text x="38" y="47" font-family="'Poppins', 'Inter', system-ui, sans-serif" font-size="22" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">$100</text>
  
  <!-- Typography -->
  <text x="84" y="37" font-family="'Poppins', 'Inter', system-ui, sans-serif" font-size="19" font-weight="900" fill="#0F3D2E" letter-spacing="-0.3">100 DOLLAR</text>
  <text x="84" y="56" font-family="'Poppins', 'Inter', system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#E8890C" letter-spacing="2.2">WEBSITE DESIGN</text>
</svg>

